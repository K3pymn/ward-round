<!DOCTYPE html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward Round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --btn: #ffffff;
    --ink: #15202c;
    --muted: #5f6d7c;
    --faint: #a3afbd;
    --line: #d3dbe5;
    --grid: #a9b8c9;
    --zebra: #f7f9fc;
    --brand-ink: #1f3a5f;
    --head-bg: #1f3a5f;
    --head-ink: #ffffff;
    --ok: #17663a;
    --ok-soft: #e3f3e8;
    --ok-line: #9fd3ae;
    --fever: #b42318;
    --fever-soft: #fdeaea;
    --focus: #fff6d6;
    --focus-ring: #e9b949;
    --shadow: 0 1px 3px rgba(21, 32, 44, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e141b; --card: #16202b; --btn: #1c2835; --ink: #e4ebf3; --muted: #9aa9b9; --faint: #5d6c7c;
      --line: #2a3847; --grid: #34465a; --zebra: #1a2531; --brand-ink: #9cc0ea; --head-bg: #24466f; --head-ink: #f1f5fa;
      --ok: #6fd29a; --ok-soft: #15301f; --ok-line: #2c5a3c; --fever: #ff8a80; --fever-soft: #3a1a1a;
      --focus: #2e2a17; --focus-ring: #b8912f; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e141b; --card: #16202b; --btn: #1c2835; --ink: #e4ebf3; --muted: #9aa9b9; --faint: #5d6c7c;
    --line: #2a3847; --grid: #34465a; --zebra: #1a2531; --brand-ink: #9cc0ea; --head-bg: #24466f; --head-ink: #f1f5fa;
    --ok: #6fd29a; --ok-soft: #15301f; --ok-line: #2c5a3c; --fever: #ff8a80; --fever-soft: #3a1a1a;
    --focus: #2e2a17; --focus-ring: #b8912f; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", Tahoma, sans-serif;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--bg); padding-block: 10px;
  }
  .toolbar .spacer { flex: 1; }
  .saved { font-size: 13px; color: var(--muted); }
  .saved.err { color: var(--fever); }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--btn); color: var(--ink);
    padding: 8px 14px; border-radius: 8px;
  }
  button:hover { border-color: var(--brand-ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: wait; }
  button.primary { background: var(--head-bg); border-color: var(--head-bg); color: var(--head-ink); font-weight: 600; }
  button.danger { color: var(--fever); }

  /* ---------- sheet ---------- */
  .sheet { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
  .header {
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    align-items: flex-end; justify-content: space-between;
    border-bottom: 2px solid var(--head-bg); padding-bottom: 8px; margin-bottom: 12px;
  }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--brand-ink); text-wrap: balance; }
  .dc-count {
    font-size: 14px; font-weight: 600; color: var(--ok);
    background: var(--ok-soft); border-radius: 999px; padding: 3px 12px;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 18px; }
  .meta label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta input {
    font: inherit; color: var(--ink); border: none; border-bottom: 1px dotted var(--muted);
    padding: 2px 4px; width: 140px; background: transparent;
  }
  .meta input:focus { outline: none; border-bottom: 1.5px solid var(--brand-ink); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border: 1px solid var(--grid); vertical-align: top; }
  th { background: var(--head-bg); color: var(--head-ink); padding: 8px 6px; font-weight: 600; }
  td { padding: 0; }
  .sheet tbody tr:nth-child(even) td { background: var(--zebra); }
  .sheet tbody tr.is-dc td { background: var(--ok-soft); }
  col.c-bed { width: 5%; } col.c-dx { width: 16%; } col.c-fever { width: 11%; } col.c-obj { width: 17%; }
  col.c-plan { width: 16%; } col.c-order { width: 16%; } col.c-inv { width: 14%; } col.c-dc { width: 5%; }
  col.c-act { width: 38px; }

  .cell {
    min-height: 70px; padding: 8px; outline: none;
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  .cell:focus { background: var(--focus); box-shadow: inset 0 0 0 2px var(--focus-ring); }
  .cell:empty::before { content: attr(data-ph); color: var(--faint); }
  .bed { text-align: center; font-weight: 700; font-size: 18px; }

  /* fever */
  .fever { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: none; border-radius: 0; padding: 6px 4px; background: var(--btn); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on-no  { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .seg button.on-yes { background: var(--fever-soft); color: var(--fever); font-weight: 700; }
  .temp { display: none; align-items: center; gap: 4px; }
  .temp.show { display: flex; }
  .temp input {
    font: inherit; width: 64px; padding: 4px 6px; text-align: center; color: var(--ink);
    background: var(--btn); border: 1px solid var(--line); border-radius: 6px;
  }
  .temp input.hot { border-color: var(--fever); color: var(--fever); font-weight: 700; }

  /* numbered list + checklist */
  .checklist { padding: 6px 8px; min-height: 70px; }
  .ck { display: flex; align-items: flex-start; gap: 6px; padding: 2px 0; }
  .ck input[type=checkbox] { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--ok); cursor: pointer; flex: none; }
  .ck-t { flex: 1; outline: none; line-height: 1.5; word-break: break-word; border-radius: 4px; padding: 0 2px; }
  .ck-t:focus { background: var(--focus); }
  .ck.done .ck-t { text-decoration: line-through; color: var(--muted); }
  .ck-n { width: 17px; flex: none; text-align: right; line-height: 1.5; font-weight: 600; color: var(--brand-ink); }
  .ck-add {
    width: 100%; font: inherit; border: none; background: transparent;
    padding: 3px 2px 3px 23px; outline: none; color: var(--ink);
  }
  .ck-add::placeholder { color: var(--faint); }
  .ck-add:focus { background: var(--focus); border-radius: 4px; }

  /* discharge + delete */
  .dc { text-align: center; vertical-align: middle; }
  .dc label { display: inline-flex; cursor: pointer; }
  .dc input { width: 22px; height: 22px; accent-color: var(--ok); cursor: pointer; margin: 0; }
  .dc-lbl { display: none; }
  .act { text-align: center; vertical-align: middle; }
  .act button { border: none; background: none; color: var(--faint); font-size: 18px; padding: 4px; }
  .act button:hover { color: var(--fever); }

  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.6; }

  /* confirm dialog (the viewer blocks window.confirm) */
  dialog {
    border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    background: var(--card); color: var(--ink); max-width: min(420px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(10, 16, 24, .45); }
  dialog p { margin: 0 0 16px; line-height: 1.6; }
  .ask-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .danger-fill { background: var(--fever); border-color: var(--fever); color: #fff; font-weight: 600; }

  /* order summary */
  #sum { width: min(560px, calc(100vw - 32px)); max-width: none; padding: 0; }
  .sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
  .sum-head h2 { margin: 0; font-size: 19px; color: var(--brand-ink); }
  .sum-sub { font-size: 13px; color: var(--muted); }
  .sum-body { max-height: min(60vh, 520px); overflow-y: auto; padding: 8px 20px; }
  .sum-bed { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sum-bed:last-child { border-bottom: none; }
  .sum-bed h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
  .sum-dx { font-size: 13px; font-weight: 400; color: var(--muted); }
  .sum-bed label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; line-height: 1.5; }
  .sum-bed input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--ok); flex: none; }
  .sum-bed label.done span { text-decoration: line-through; color: var(--muted); }
  .sum-empty { color: var(--muted); padding: 24px 0; text-align: center; line-height: 1.6; }
  .sum-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  .sum-foot .note { flex: 1; font-size: 13px; color: var(--muted); }
  .sum-copy { width: 100%; min-height: 90px; font: inherit; font-size: 13px; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }

  .busy {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: var(--bg); color: var(--muted); font-size: 16px;
  }

  /* ---------- phone / narrow window: one card per bed (9 columns need ~1000px) ---------- */
  @media (max-width: 1000px) {
    body { font-size: 16px; }   /* 16px+ stops iOS zooming into fields */
    .wrap { padding: 10px 16px; }
    .toolbar { position: static; gap: 6px; }
    .toolbar .spacer { display: none; }
    .toolbar button { padding: 9px 11px; }
    .saved { order: 10; width: 100%; }
    .sheet { background: transparent; box-shadow: none; padding: 0; }
    .header { background: var(--card); border-radius: 12px; padding: 12px; border-bottom: 3px solid var(--head-bg); }
    h1 { font-size: 22px; }
    .meta { width: 100%; flex-direction: column; gap: 8px; }
    .meta label { width: 100%; }
    .meta input { flex: 1; width: auto; font-size: 16px; }

    .sheet table, .sheet tbody { display: block; }
    .sheet colgroup, .sheet thead { display: none; }
    .sheet tbody tr {
      display: grid; grid-template-columns: 1fr auto auto; align-items: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 12px; overflow: hidden;
    }
    .sheet tbody tr td, .sheet tbody tr:nth-child(even) td, .sheet tbody tr.is-dc td { background: transparent; }
    .sheet tbody tr.is-dc { background: var(--ok-soft); border-color: var(--ok-line); }
    .sheet td { display: block; border: none; border-top: 1px solid var(--line); grid-column: 1 / -1; }
    .sheet td[data-label]::before {
      content: attr(data-label); display: block;
      font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); padding: 8px 10px 0;
    }
    /* first line of the card: bed | D/C | delete */
    .sheet td.td-bed, .sheet td.dc, .sheet td.act { grid-row: 1; }
    .sheet td.td-bed { grid-column: 1; border-top: none; display: flex; align-items: center; }
    .sheet td.td-bed::before { padding: 0 0 0 12px; }
    .bed { text-align: left; min-height: 0; padding: 10px; font-size: 20px; flex: 1; }
    .sheet td.dc { grid-column: 2; border-top: none; padding: 0 6px; }
    .dc label { align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); }
    .dc-lbl { display: inline; font-weight: 600; color: var(--ok); }
    .sheet td.act { grid-column: 3; border-top: none; padding-right: 6px; }
    .act button { font-size: 22px; padding: 8px; }

    .cell, .checklist { min-height: 44px; }
    .cell, .ck-t, .ck-add, .temp input { font-size: 16px; }
    .fever { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .seg { flex: 0 0 170px; }
    .seg button { padding: 9px 4px; }
    .ck input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; }
  }

  /* ---------- PDF pages (always paper colours, rendered off-screen) ---------- */
  .pdf-host { position: fixed; top: 0; left: 0; z-index: 40; width: 1123px; }
  .pdf-page {
    width: 1123px; height: 794px; padding: 38px; background: #ffffff; color: #111827;
    font-family: "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, sans-serif; font-size: 13.5px;
  }
  .pdf-in { display: flex; flex-direction: column; gap: 10px; }
  .pdf-head { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #1f3a5f; padding-bottom: 6px; }
  .pdf-head h2 { margin: 0; font-size: 22px; color: #1f3a5f; display: flex; align-items: baseline; gap: 10px; }
  .pdf-pill { font-size: 12.5px; font-weight: 600; color: #17663a; background: #e3f3e8; border-radius: 999px; padding: 2px 10px; }
  .pdf-meta { display: flex; gap: 18px; font-size: 13px; }
  .pdf-meta b { font-weight: 500; display: inline-block; min-width: 110px; border-bottom: 1px dotted #555; padding: 0 4px; }
  .pdf-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .pdf-table th { background: #1f3a5f; color: #fff; font-weight: 600; padding: 6px 4px; border: 1px solid #8a9bb0; }
  .pdf-table td { border: 1px solid #8a9bb0; padding: 5px 6px; vertical-align: top; height: 64px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .pdf-table tr:nth-child(even) td { background: #f3f6fa; }
  .pdf-table tr.is-dc td { background: #e3f3e8; }
  .pdf-bed { text-align: center; font-weight: 700; font-size: 16px; }
  .pdf-n { color: #1f3a5f; font-weight: 600; }
  .pbox {
    display: inline-block; width: 12px; height: 12px; border: 1.3px solid #222; border-radius: 2px;
    margin-right: 4px; vertical-align: -1px; text-align: center; font-size: 10px; line-height: 10px; font-weight: 700;
  }
  .p-hot { color: #b42318; font-weight: 700; }
  .p-t { display: inline-block; min-width: 40px; border-bottom: 1px dotted #555; text-align: center; }
  .p-done { text-decoration: line-through; color: #6b7280; }
  .pdf-dc { text-align: center; vertical-align: middle !important; }
  .pdf-dc .pbox { width: 16px; height: 16px; font-size: 13px; line-height: 13px; margin: 0; color: #17663a; border-color: #17663a; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="toolbar">
    <button id="add" type="button">+ เพิ่มเตียง</button>
    <button id="clear" type="button" class="danger">Clear</button>
    <span class="saved" id="saved" role="status"></span>
    <span class="spacer"></span>
    <button id="sumBtn" type="button">สรุป Order</button>
    <button id="pdf" type="button" class="primary">Export PDF</button>
  </div>

  <div class="sheet">
    <div class="header">
      <div class="title">
        <h1>Ward Round</h1>
        <span class="dc-count" id="dcCount"></span>
      </div>
      <div class="meta">
        <label>Ward: <input id="ward" autocomplete="off"></label>
        <label>วันที่: <input id="date" type="date"></label>
        <label>แพทย์: <input id="doctor" autocomplete="off"></label>
      </div>
    </div>

    <table>
      <colgroup>
        <col class="c-bed"><col class="c-dx"><col class="c-fever"><col class="c-obj"><col class="c-plan"><col class="c-order"><col class="c-inv"><col class="c-dc"><col class="c-act">
      </colgroup>
      <thead>
        <tr><th>เตียง</th><th>Diagnosis</th><th>ไข้</th><th>Objective</th><th>Plan</th><th>Order</th><th>สิ่งที่ต้องไปตรวจเพิ่ม</th><th>D/C</th><th class="act"></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="hint" id="hint"></p>
</div>

<dialog id="sum" aria-labelledby="sumTitle">
  <div class="sum-head">
    <h2 id="sumTitle">สรุป Order</h2>
    <span class="sum-sub" id="sumSub"></span>
  </div>
  <div class="sum-body" id="sumBody"></div>
  <div class="sum-foot">
    <span class="note" id="sumNote">ติ๊กเมื่อ order แล้ว</span>
    <button id="sumCopy" type="button">คัดลอกรายการที่ค้าง</button>
    <button id="sumClose" type="button" class="primary">ปิด</button>
  </div>
</dialog>

<dialog id="ask">
  <p id="askMsg"></p>
  <div class="ask-actions">
    <button id="askNo" type="button">ยกเลิก</button>
    <button id="askYes" type="button" class="danger-fill">ตกลง</button>
  </div>
</dialog>

<script>
const KEY = 'ward-round-v1';
const $ = id => document.getElementById(id);
const tbody = $('rows');

// local date (toISOString would give yesterday's date before 07:00 in Thailand)
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function hhmm() { return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function blankRow() { return { bed: '', dx: [], fever: '', temp: '', obj: '', plan: '', order: [], inv: [], dc: false }; }
function freshRound(date, keep) {
  return { ward: keep ? keep.ward : '', doctor: keep ? keep.doctor : '', date, rows: Array.from({ length: 8 }, blankRow) };
}
// Accepts anything that was ever saved (older saves kept dx/inv as plain text).
function normalize(s) {
  s = s || {};
  const toItems = v => Array.isArray(v)
    ? v.map(it => ({ t: String((it && it.t) || ''), done: !!(it && it.done) })).filter(it => it.t)
    : String(v || '').split('\n').map(t => t.trim()).filter(Boolean).map(t => ({ t, done: false }));
  const rows = (Array.isArray(s.rows) ? s.rows : []).map(r => ({
    bed: String(r.bed || ''), dx: toItems(r.dx),
    fever: r.fever === 'yes' || r.fever === 'no' ? r.fever : '', temp: String(r.temp || ''),
    obj: String(r.obj || ''), plan: String(r.plan || ''), order: toItems(r.order), inv: toItems(r.inv), dc: !!r.dc
  }));
  return {
    ward: String(s.ward || ''), doctor: String(s.doctor || ''),
    date: /^\d{4}-\d{2}-\d{2}$/.test(s.date || '') ? s.date : today(), rows
  };
}
const same = (a, b) => JSON.stringify(normalize(a)) === JSON.stringify(normalize(b));
function rowHasData(r) { return !!(r.bed || r.dx.length || r.fever || r.obj || r.plan || r.order.length || r.inv.length || r.dc); }
function hasData() { return state.rows.some(rowHasData); }

// ---------- state + local cache ----------
let cached = null;
try { cached = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
let state = cached ? normalize(cached) : freshRound(today());
let dirty = !!(cached && cached._dirty);   // edits not yet in the cloud

function saveLocalNow() {
  try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, state, { _dirty: dirty }))); return true; }
  catch (e) { return false; }
}
let localTimer;
function changed() {
  updateDcCount();
  dirty = true;
  clearTimeout(localTimer);
  localTimer = setTimeout(() => {
    const ok = saveLocalNow();
    if (!cloud) status(ok ? 'บันทึกในเครื่องนี้แล้ว ' + hhmm() : 'บันทึกอัตโนมัติไม่ได้ในเบราว์เซอร์นี้', !ok);
  }, 300);
  scheduleFlush();
}
function status(msg, err) {
  $('saved').textContent = msg;
  $('saved').classList.toggle('err', !!err);
}

// ---------- cloud (claude.ai artifact db): one document per round date ----------
let cloud = null, unsub = null, loaded = false, writing = false, readOnly = false;
let flushTimer = null, pendingRemote = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function scheduleFlush(ms = 800) {
  if (!cloud || readOnly) return;
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, ms);
}
async function flush() {
  if (!cloud || readOnly || !dirty) return;
  if (!loaded || writing) { scheduleFlush(); return; }   // never write over a round we haven't read yet
  writing = true; dirty = false; pendingRemote = null;
  const snap = JSON.parse(JSON.stringify(state));
  status('กำลังบันทึก…');
  try {
    await cloud.doc('rounds/' + snap.date).set({ round: snap });
    if (!dirty) { status('☁ บันทึกบน cloud แล้ว ' + hhmm()); saveLocalNow(); }
  } catch (e) {
    dirty = true; saveLocalNow();
    const code = e && e.code;
    if (code === 'invalid_argument') { readOnly = true; status('บัญชีนี้ดู round ได้อย่างเดียว แก้ไขไม่ได้', true); }
    else if (code === 'quota_exceeded') { status('พื้นที่ cloud เต็ม ลบ round เก่าก่อนแล้วลองใหม่', true); }
    else if (code === 'revoked') { cloud = null; status('การเชื่อมต่อ cloud ถูกปิด บันทึกไว้ในเครื่องนี้แทน', true); }
    else { status('ยังบันทึกขึ้น cloud ไม่ได้ จะลองใหม่อัตโนมัติ', true); scheduleFlush(5000); }
  } finally {
    writing = false;
  }
  if (dirty && !readOnly && cloud) scheduleFlush();
}

function editing() {
  const a = document.activeElement;
  return !!a && tbody.contains(a) && (a.isContentEditable || (a.tagName === 'INPUT' && a.type !== 'checkbox'));
}
function applyRemote(remote, note) {
  state = remote;
  render();
  if ($('sum').open) renderSummary();
  saveLocalNow();
  status(note || '☁ อัปเดตจากอีกเครื่องแล้ว ' + hhmm());
}
// a change from another device waits until the viewer leaves the field they're typing in
tbody.addEventListener('focusout', () => setTimeout(() => {
  if (pendingRemote && !editing() && !dirty && !writing) { const r = pendingRemote; pendingRemote = null; applyRemote(r); }
}, 0));

function subscribe(date) {
  if (unsub) unsub();
  loaded = false;
  status('กำลังโหลด round…');
  unsub = cloud.doc('rounds/' + date).onSnapshot(snap => {
    if (date !== state.date) return;
    if (!snap.exists && snap.metadata.fromCache) return;   // wait for the server's answer
    const first = !loaded;
    loaded = true;
    if (!snap.exists) {
      // nothing in the cloud for this date yet: upload what this device has
      if (dirty || (first && hasData())) { dirty = true; scheduleFlush(0); }
      else status('☁ round ใหม่ของวันที่ ' + date);
      return;
    }
    const remote = normalize(snap.data().round);
    remote.date = date;
    if (same(remote, state)) { if (!dirty && !writing) status('☁ ซิงก์แล้ว ' + hhmm()); return; }
    if (dirty || writing) { if (first) scheduleFlush(0); return; }   // this device's newer edits win
    if (editing()) { pendingRemote = remote; return; }
    applyRemote(remote, first ? '☁ โหลดจาก cloud แล้ว ' + hhmm() : undefined);
  }, err => {
    status('เชื่อมต่อ cloud ไม่ได้ ข้อมูลยังบันทึกในเครื่องนี้', true);
    if (err && err.code === 'unavailable') setTimeout(() => { if (cloud && state.date === date) subscribe(date); }, 5000);
  });
}

async function switchDate(date) {
  clearTimeout(flushTimer);
  while (writing) await sleep(100);
  if (dirty) await flush();          // finish saving the round we're leaving
  while (writing) await sleep(100);
  state = freshRound(date, state);
  dirty = false; pendingRemote = null;
  render(); saveLocalNow();
  subscribe(date);
}

// ---------- in-page confirm ----------
function ask(msg, yes) {
  return new Promise(resolve => {
    const d = $('ask');
    $('askMsg').textContent = msg;
    $('askYes').textContent = yes || 'ตกลง';
    const done = v => { $('askYes').onclick = $('askNo').onclick = d.oncancel = null; if (d.open) d.close(); resolve(v); };
    $('askYes').onclick = () => done(true);
    $('askNo').onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
  });
}

// ---------- rendering ----------
// Item list: editable text per item, led by a tick box (checklist) or a number (numbered);
// type in the bottom line + Enter to add, Backspace on an empty item removes it.
function buildChecklist(box, items, opts = { numbered: false, ph: '+ เพิ่ม เช่น ฟัง lung, ดูแผล' }) {
  box.innerHTML = '';
  const add = document.createElement('input');
  add.className = 'ck-add';
  add.placeholder = items.length ? '+ เพิ่ม' : opts.ph;
  add.setAttribute('aria-label', 'เพิ่ม ' + opts.ph.replace(/^\+\s*/, ''));

  const focusEnd = el => {
    el.focus();
    const sel = getSelection(); sel.selectAllChildren(el); sel.collapseToEnd();
  };

  items.forEach((it, j) => {
    const row = document.createElement('div');
    row.className = 'ck' + (it.done ? ' done' : '');
    row.innerHTML = (opts.numbered ? `<span class="ck-n">${j + 1}.</span>` : '<input type="checkbox">') +
                    '<div class="ck-t" contenteditable></div>';
    const cb = row.firstChild, txt = row.lastChild;
    txt.innerText = it.t;
    if (!opts.numbered) {
      cb.checked = it.done;
      cb.addEventListener('change', () => { it.done = cb.checked; row.classList.toggle('done', it.done); changed(); });
    }
    txt.addEventListener('input', () => { it.t = txt.innerText.replace(/\n/g, ' ').trim(); changed(); });
    txt.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); add.focus(); }
      if (e.key === 'Backspace' && !txt.innerText.trim()) {
        e.preventDefault();
        items.splice(j, 1); changed();
        buildChecklist(box, items, opts);
        const prev = box.querySelectorAll('.ck-t')[j - 1];
        prev ? focusEnd(prev) : box.querySelector('.ck-add').focus();
      }
    });
    txt.addEventListener('blur', () => {
      const k = items.indexOf(it);
      if (!it.t && k >= 0) { items.splice(k, 1); changed(); buildChecklist(box, items, opts); }
    });
    box.appendChild(row);
  });

  const commit = () => {
    const t = add.value.trim();
    if (!t) return false;
    add.value = '';   // so a blur fired while the list rebuilds can't add it twice
    items.push({ t, done: false }); changed();
    buildChecklist(box, items, opts);
    return true;
  };
  add.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (commit()) box.querySelector('.ck-add').focus(); }
    if (e.key === 'Backspace' && !add.value && items.length) {
      e.preventDefault(); focusEnd(box.querySelectorAll('.ck-t')[items.length - 1]);
    }
  });
  add.addEventListener('blur', commit);
  box.appendChild(add);
}

function updateDcCount() {
  const pts = state.rows.filter(rowHasData).length;
  const dc = state.rows.filter(r => r.dc).length;
  $('dcCount').textContent = `D/C ${dc} ราย` + (pts ? ` · จาก ${pts} เตียง` : '');
}

function render() {
  $('ward').value = state.ward;
  $('date').value = state.date;
  $('doctor').value = state.doctor;
  tbody.innerHTML = '';
  state.rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-bed" data-label="เตียง"><div class="cell bed" contenteditable data-k="bed" data-ph="#"></div></td>
      <td data-label="Diagnosis"><div class="checklist dx"></div></td>
      <td data-label="ไข้">
        <div class="fever">
          <div class="seg">
            <button type="button" data-f="no">ไม่มี</button>
            <button type="button" data-f="yes">มี</button>
          </div>
          <div class="temp"><span>T</span><input inputmode="decimal" placeholder="38.0" aria-label="อุณหภูมิ"><span>°C</span></div>
        </div>
      </td>
      <td data-label="Objective"><div class="cell" contenteditable data-k="obj" data-ph="V/S, PE, Lab"></div></td>
      <td data-label="Plan"><div class="cell" contenteditable data-k="plan" data-ph="Plan"></div></td>
      <td data-label="Order"><div class="checklist order"></div></td>
      <td data-label="สิ่งที่ต้องไปตรวจเพิ่ม"><div class="checklist inv"></div></td>
      <td class="dc"><label><input type="checkbox" aria-label="D/C"><span class="dc-lbl">D/C</span></label></td>
      <td class="act"><button type="button" title="ลบแถวนี้" aria-label="ลบแถวนี้">✕</button></td>`;

    buildChecklist(tr.querySelector('.checklist.dx'), r.dx, { numbered: true, ph: '+ Diagnosis' });
    buildChecklist(tr.querySelector('.checklist.order'), r.order, { numbered: false, ph: '+ order เช่น CBC, CXR' });
    buildChecklist(tr.querySelector('.checklist.inv'), r.inv);

    tr.querySelectorAll('.cell').forEach(c => {
      c.innerText = r[c.dataset.k];
      c.addEventListener('input', () => { r[c.dataset.k] = c.innerText.replace(/\n$/, ''); changed(); });
    });

    const seg = tr.querySelectorAll('.seg button');
    const tempBox = tr.querySelector('.temp');
    const tempIn = tempBox.querySelector('input');
    const paint = () => {
      seg[0].className = r.fever === 'no' ? 'on-no' : '';
      seg[1].className = r.fever === 'yes' ? 'on-yes' : '';
      tempBox.classList.toggle('show', r.fever === 'yes');
      tempIn.classList.toggle('hot', parseFloat(r.temp) >= 38);
    };
    tempIn.value = r.temp;
    seg.forEach(b => b.addEventListener('click', () => {
      r.fever = r.fever === b.dataset.f ? '' : b.dataset.f;
      paint(); changed();
      if (r.fever === 'yes') tempIn.focus();
    }));
    tempIn.addEventListener('input', () => { r.temp = tempIn.value.trim(); paint(); changed(); });
    paint();

    const dc = tr.querySelector('.dc input');
    dc.checked = r.dc;
    tr.classList.toggle('is-dc', r.dc);
    dc.addEventListener('change', () => { r.dc = dc.checked; tr.classList.toggle('is-dc', r.dc); changed(); });

    tr.querySelector('.act button').addEventListener('click', async () => {
      if (rowHasData(r) && !(await ask(`ลบเตียง ${r.bed || 'นี้'} ออกจาก round?`, 'ลบ'))) return;
      state.rows.splice(state.rows.indexOf(r), 1);
      render(); changed();
    });
    tbody.appendChild(tr);
  });
  updateDcCount();
}

// ---------- toolbar + header ----------
['ward', 'doctor'].forEach(k => $(k).addEventListener('input', e => { state[k] = e.target.value; changed(); }));
$('date').addEventListener('change', e => {
  const d = e.target.value;
  if (!d || d === state.date) return;
  if (cloud) switchDate(d);
  else { state.date = d; changed(); }
});

$('add').addEventListener('click', () => {
  state.rows.push(blankRow());
  render(); changed();
  tbody.lastElementChild.querySelector('.cell').focus();
});

$('clear').addEventListener('click', async () => {
  const where = cloud ? ' ข้อมูลจะหายจากทุกเครื่อง' : '';
  if (!(await ask(`ล้างข้อมูลทุกเตียงของ round วันที่ ${state.date}?${where}`, 'Clear'))) return;
  state = freshRound(state.date, state);
  render(); changed();
});

// ---------- order summary: every bed that has orders, tick them off after the round ----------
const bedName = r => r.bed ? 'เตียง ' + r.bed : 'เตียง (ไม่ระบุเลข)';
function renderSummary() {
  const beds = state.rows.filter(r => r.order.length);
  const all = beds.reduce((n, r) => n + r.order.length, 0);
  const left = beds.reduce((n, r) => n + r.order.filter(o => !o.done).length, 0);
  $('sumSub').textContent = all
    ? `${state.date.split('-').reverse().join('/')} · ค้าง ${left} จาก ${all} รายการ`
    : state.date.split('-').reverse().join('/');
  $('sumCopy').hidden = !left;
  $('sumNote').textContent = all ? (left ? 'ติ๊กเมื่อ order แล้ว' : 'order ครบทุกรายการแล้ว') : '';
  const body = $('sumBody');
  body.innerHTML = '';
  if (!all) {
    body.innerHTML = '<p class="sum-empty">ยังไม่มี order ใน round นี้<br>เพิ่มได้ในช่อง Order ของแต่ละเตียง</p>';
    return;
  }
  beds.forEach(r => {
    const sec = document.createElement('div');
    sec.className = 'sum-bed';
    const dx = r.dx.map(d => d.t).join(', ');
    sec.innerHTML = `<h3>${esc(bedName(r))}${dx ? `<span class="sum-dx">${esc(dx)}</span>` : ''}</h3>`;
    r.order.forEach(o => {
      const lab = document.createElement('label');
      lab.className = o.done ? 'done' : '';
      lab.innerHTML = '<input type="checkbox"><span></span>';
      lab.firstChild.checked = o.done;
      lab.lastChild.textContent = o.t;
      lab.firstChild.addEventListener('change', e => {
        o.done = e.target.checked;
        render(); changed(); renderSummary();
      });
      sec.appendChild(lab);
    });
    body.appendChild(sec);
  });
}
function summaryText() {
  const lines = [`Order round ${state.date.split('-').reverse().join('/')}${state.ward ? ' ' + state.ward : ''}`];
  state.rows.forEach(r => {
    const left = r.order.filter(o => !o.done).map(o => o.t);
    if (left.length) lines.push(`${bedName(r)}: ${left.join(', ')}`);
  });
  return lines.join('\n');
}
$('sumBtn').addEventListener('click', () => { renderSummary(); $('sum').showModal(); });
$('sumClose').addEventListener('click', () => $('sum').close());
$('sumCopy').addEventListener('click', () => {
  const text = summaryText();
  const fallback = () => {
    // clipboard refused: show the text selected so the viewer can copy it themselves
    let ta = $('sumBody').querySelector('.sum-copy');
    if (!ta) { ta = document.createElement('textarea'); ta.className = 'sum-copy'; ta.readOnly = true; $('sumBody').prepend(ta); }
    ta.value = text; ta.focus(); ta.select();
    $('sumNote').textContent = 'กดค้างที่ข้อความแล้วเลือกคัดลอก';
  };
  try {
    navigator.clipboard.writeText(text).then(() => { $('sumNote').textContent = 'คัดลอกแล้ว วางในแชทได้เลย'; }, fallback);
  } catch (e) { fallback(); }
});

// ---------- PDF: draw A4 landscape pages off-screen, rasterise, hand the file over ----------
const LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
];
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('โหลดตัวสร้าง PDF ไม่ได้ เช็กอินเทอร์เน็ต'));
    document.head.appendChild(s);
  });
}
const pbox = on => `<span class="pbox">${on ? '✓' : ''}</span>`;
function pdfRow(r) {
  const yes = r.fever === 'yes';
  const dx = r.dx.map((it, i) => `<span class="pdf-n">${i + 1}.</span> ${esc(it.t)}`).join('<br>');
  const ticks = items => items.map(it => `${pbox(it.done)}<span class="${it.done ? 'p-done' : ''}">${esc(it.t)}</span>`).join('<br>');
  const inv = ticks(r.inv);
  return `<tr class="${r.dc ? 'is-dc' : ''}">
    <td class="pdf-bed">${esc(r.bed)}</td>
    <td>${dx}</td>
    <td>${pbox(r.fever === 'no')}ไม่มี<br><span class="${yes ? 'p-hot' : ''}">${pbox(yes)}มี T <span class="p-t">${yes ? esc(r.temp) : ''}</span> °C</span></td>
    <td>${esc(r.obj)}</td>
    <td>${esc(r.plan)}</td>
    <td>${ticks(r.order)}</td>
    <td>${inv}</td>
    <td class="pdf-dc">${pbox(r.dc)}</td></tr>`;
}
function pdfPage(host) {
  const pts = state.rows.filter(rowHasData).length, dcs = state.rows.filter(r => r.dc).length;
  const page = document.createElement('div');
  page.className = 'pdf-page';
  page.innerHTML = `<div class="pdf-in">
    <div class="pdf-head">
      <h2>Ward Round <span class="pdf-pill">D/C ${dcs} ราย${pts ? ` · จาก ${pts} เตียง` : ''}</span></h2>
      <div class="pdf-meta"><span>Ward: <b>${esc(state.ward)}</b></span><span>วันที่: <b>${esc(state.date.split('-').reverse().join('/'))}</b></span><span>แพทย์: <b>${esc(state.doctor)}</b></span></div>
    </div>
    <table class="pdf-table">
      <colgroup><col style="width:5%"><col style="width:16%"><col style="width:12%"><col style="width:17%"><col style="width:16%"><col style="width:15%"><col style="width:14%"><col style="width:5%"></colgroup>
      <thead><tr><th>เตียง</th><th>Diagnosis</th><th>ไข้</th><th>Objective</th><th>Plan</th><th>Order</th><th>สิ่งที่ต้องไปตรวจเพิ่ม</th><th>D/C</th></tr></thead>
      <tbody></tbody>
    </table></div>`;
  host.appendChild(page);
  return page;
}
function buildPdfPages(host) {
  const pages = [];
  let page = pdfPage(host), body = page.querySelector('tbody');
  pages.push(page);
  const limit = 794 - 2 * 38;
  state.rows.forEach(r => {
    body.insertAdjacentHTML('beforeend', pdfRow(r));
    const inner = page.querySelector('.pdf-in');
    if (inner.offsetHeight > limit && body.children.length > 1) {
      body.lastElementChild.remove();
      page = pdfPage(host); body = page.querySelector('tbody'); pages.push(page);
      body.insertAdjacentHTML('beforeend', pdfRow(r));
    }
  });
  return pages;
}
function pdfName() {
  return ['Round', state.ward, state.date].filter(Boolean).join('_').replace(/[\\/:*?"<>|\s]+/g, '-') + '.pdf';
}

$('pdf').addEventListener('click', async () => {
  const btn = $('pdf');
  btn.disabled = true;
  const cover = document.createElement('div');
  cover.className = 'busy'; cover.textContent = 'กำลังสร้าง PDF…';
  const host = document.createElement('div');
  host.className = 'pdf-host';
  document.body.append(host, cover);
  try {
    await Promise.all(LIBS.map(loadScript));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const pages = buildPdfPages(host);
    const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    for (let i = 0; i < pages.length; i++) {
      const canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 1200, scrollX: 0, scrollY: 0 });
      if (i) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
    }
    const blob = pdf.output('blob');
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename: pdfName(), data: blob }); status('บันทึก PDF แล้ว'); }
      catch (e) { if (e && e.code !== 'declined') status('บันทึก PDF ไม่ได้ในหน้านี้', true); }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = pdfName();
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      status('สร้าง PDF แล้ว');
    }
  } catch (e) {
    status('สร้าง PDF ไม่ได้: ' + (e && e.message ? e.message : e), true);
  } finally {
    host.remove(); cover.remove();
    btn.disabled = false;
  }
});

// ---------- start ----------
render();
$('hint').textContent = 'ใช้แค่เลขเตียง ไม่ต้องใส่ชื่อหรือ HN คนไข้';
(async () => {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) {}
  if (!db) {
    status('บันทึกในเครื่องนี้เท่านั้น');
    $('hint').textContent = 'ข้อมูลบันทึกในเบราว์เซอร์เครื่องนี้เท่านั้น · ใช้แค่เลขเตียง ไม่ต้องใส่ชื่อหรือ HN คนไข้';
    return;
  }
  cloud = db;
  $('hint').textContent = 'ข้อมูลเก็บบน cloud เปิดจากโทรศัพท์หรือคอมก็เห็นเหมือนกัน · เลือกวันที่ด้านบนเพื่อดู round ของวันอื่น · ใช้แค่เลขเตียง ไม่ต้องใส่ชื่อหรือ HN คนไข้';
  // open today's round unless this device still holds edits that never reached the cloud
  if (!dirty && state.date !== today()) { state = freshRound(today(), state); render(); saveLocalNow(); }
  subscribe(state.date);
})();
